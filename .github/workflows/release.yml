name: release

# Pushing a v* tag publishes a GitHub release and points the Homebrew formula at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -nE 's/^const VERSION = "(.*)";$/\1/p' computer-use-bridge.mjs)"
          [[ "$have" == "$want" ]] || { echo "VERSION is $have but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Point the formula at the release
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i -E "s|^  url \".*\"$|  url \"$url\"|; s|^  sha256 \".*\"$|  sha256 \"$sha\"|" Formula/computer-use-bridge.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "computer-use-bridge ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:main
