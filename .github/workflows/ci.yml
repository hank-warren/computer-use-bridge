name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax, tests and CLI (tabs only)
        run: |
          for f in bin/*.mjs src/*.mjs src/engines/*.mjs; do node --check "$f"; done
          node dev/logic-test.mjs
          node bin/computer-use-bridge.mjs --version
          npm pack --dry-run

  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax and CLI
        run: |
          for f in bin/*.mjs src/*.mjs src/engines/*.mjs dev/*.mjs; do node --check "$f"; done
          node dev/logic-test.mjs
          node bin/computer-use-bridge.mjs --version
          node bin/computer-use-bridge.mjs help >/dev/null
      - name: Formula style
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap local/computer-use-bridge "$GITHUB_WORKSPACE"
          brew style local/computer-use-bridge/computer-use-bridge
