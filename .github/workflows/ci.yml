name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax, tests and CLI (tabs only)
        run: |
          node --check computer-use-bridge.mjs
          node dev/logic-test.mjs
          node computer-use-bridge.mjs --version
          if node computer-use-bridge.mjs setup --yes; then echo "setup must refuse on Linux" >&2; exit 1; fi

  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax and CLI
        run: |
          node --check computer-use-bridge.mjs
          node --check dev/mcp-call.mjs
          node dev/logic-test.mjs
          node computer-use-bridge.mjs --version
          node computer-use-bridge.mjs help >/dev/null
      - name: Formula style
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap local/computer-use-bridge "$GITHUB_WORKSPACE"
          brew style local/computer-use-bridge/computer-use-bridge
